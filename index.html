<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Token 记账本</title><style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#192338;background:#f5f7fb;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}main{max-width:1120px;margin:auto;padding:42px 24px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:19px}.logo{background:#4c62e7;color:white;width:39px;height:39px;display:grid;place-items:center;border-radius:12px;font-weight:800}.subtle{color:#788399;font-size:14px}.intro{margin:48px 0 28px}.eyebrow{color:#5368dc;font-size:14px;font-weight:700;letter-spacing:.08em}h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.04em;margin:10px 0}p{color:#718096;line-height:1.6;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #dce2ed;background:#fff;color:#34415a;border-radius:10px;padding:10px 15px;font-weight:650}.btn:hover{border-color:#8090ef}.primary{background:#5368e8;color:white;border-color:#5368e8}.primary:hover{background:#4054ce}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:#fff;border:1px solid #e7ebf3;border-radius:16px;box-shadow:0 4px 18px #233a6908}.card{padding:22px}.label{color:#77849a;font-size:14px}.number{font-size:30px;font-weight:750;letter-spacing:-.03em;margin:16px 0 8px;overflow-wrap:anywhere}.icon{float:right;color:#546ae6;background:#eff2ff;border-radius:10px;padding:7px}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:20px}.panel{padding:24px}.panel h2{font-size:19px;margin:0 0 6px}.form{display:grid;gap:15px;margin-top:23px}label{font-size:14px;font-weight:650;color:#46526a}input{display:block;width:100%;margin-top:7px;border:1px solid #dfe5ef;border-radius:9px;padding:11px;color:#1d2a40;background:#fff}input:focus{outline:2px solid #aab5ff;outline-offset:1px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:13px}.history-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.week{display:flex;align-items:center;gap:8px;margin:22px 0 15px}.week button{width:34px;height:34px;padding:0}.week strong{font-size:14px;flex:1;text-align:center}.week-total{background:#f5f7ff;border-radius:10px;padding:14px;display:flex;justify-content:space-between;color:#53617a;font-size:14px}.week-total b{color:#4055c8}.record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 0;border-bottom:1px solid #eef1f6}.record strong{font-size:15px}.record p{font-size:13px;margin-top:5px}.delete{border:0;background:transparent;color:#9b6471;padding:8px}.empty{text-align:center;padding:48px 10px;color:#98a3b5}.empty div{font-size:28px;margin-bottom:12px}.notice{margin-top:20px;color:#7c899c;font-size:13px;line-height:1.7}footer{margin-top:28px;text-align:center;color:#9ba5b5;font-size:13px}#message{min-height:20px;font-size:14px;color:#be4051} @media(max-width:700px){main{padding:24px 16px}.top{align-items:start}.top .subtle{display:none}.intro{margin:36px 0 22px}.cards{grid-template-columns:1fr;gap:10px}.card{padding:17px}.number{margin:10px 0 4px}.grid{grid-template-columns:1fr}.panel{padding:20px}}
</style></head><body><main><header class="top"><div class="brand"><span class="logo">T</span> Token 记账本</div><div class="actions"><button class="btn" id="importBtn">导入备份</button><button class="btn" id="exportBtn">导出备份</button><input id="file" type="file" accept="application/json,.json" hidden></div></header><section class="intro"><div class="eyebrow">YOUR TOKEN JOURNAL</div><h1>每一笔使用，都清晰可见。</h1><p>记录 Token 用量，轻松掌握每周变化。</p></section><section class="cards" aria-label="累计统计"><div class="card"><span class="icon">↗</span><div class="label">累计输入 Token</div><div class="number" id="totalIn">0</div><p class="hint">所有记录的输入总量</p></div><div class="card"><span class="icon">↙</span><div class="label">累计输出 Token</div><div class="number" id="totalOut">0</div><p class="hint">所有记录的输出总量</p></div><div class="card"><span class="icon">◈</span><div class="label">累计 Token</div><div class="number" id="totalAll">0</div><p class="hint">输入与输出合计</p></div></section><div class="grid"><section class="panel"><h2>添加记录</h2><p class="hint">手动填写一次使用量</p><form class="form" id="form"><label>日期<input type="date" id="date" required></label><div class="two"><label>输入 Token<input type="number" id="input" min="0" step="1" max="9007199254740991" placeholder="0" required></label><label>输出 Token<input type="number" id="output" min="0" step="1" max="9007199254740991" placeholder="0" required></label></div><label>备注（可选）<input id="note" maxlength="100" placeholder="例如：项目开发"></label><button class="btn primary" type="submit">添加记录</button><div id="message" role="status"></div></form></section><section class="panel"><div class="history-head"><div><h2>每周记录</h2><p class="hint">按自然周查看，周一至周日</p></div><button class="btn" id="today">本周</button></div><div class="week"><button class="btn" id="prev" aria-label="上一周">‹</button><strong id="weekLabel"></strong><button class="btn" id="next" aria-label="下一周">›</button></div><div class="week-total"><span>本周合计</span><b id="weekTotal">0 Token</b></div><div id="records"></div></section></div><p class="notice">数据仅保存在当前浏览器中，清除浏览器数据或更换设备可能导致记录丢失，建议定期导出备份。记录由你手动填写；本站不能自动读取 Codex 官方额度或使用量。</p><footer>让每一份用量，都有迹可循。</footer></main><script>
'use strict';
const KEY='token-journal-v1', $=s=>document.querySelector(s), fmt=n=>n.toLocaleString('zh-CN');let records=[],offset=0,storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!valid(parsed))throw Error();records=parsed}}catch(e){storageOK=false;$('#message').textContent='本地数据无法读取，请检查浏览器存储或导入备份。'}
function valid(a){return a.length<=100000&&a.every(x=>x&&typeof x.id==='string'&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&!isNaN(new Date(x.date+'T12:00:00').getTime())&&Number.isSafeInteger(x.input)&&x.input>=0&&Number.isSafeInteger(x.output)&&x.output>=0&&typeof x.note==='string'&&x.note.length<=100)&&a.reduce((s,x)=>s+BigInt(x.input)+BigInt(x.output),0n)<=BigInt(Number.MAX_SAFE_INTEGER)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));storageOK=true;return true}catch(e){$('#message').textContent='保存失败，请检查浏览器存储空间或权限。';return false}}
function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function monday(){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7+offset*7);return d}
function render(){let ins=records.reduce((s,r)=>s+r.input,0),outs=records.reduce((s,r)=>s+r.output,0);$('#totalIn').textContent=fmt(ins);$('#totalOut').textContent=fmt(outs);$('#totalAll').textContent=fmt(ins+outs);let start=monday(),end=new Date(start);end.setDate(end.getDate()+6);let a=localDate(start),b=localDate(end);$('#weekLabel').textContent=a+' 至 '+b;let rows=records.filter(r=>r.date>=a&&r.date<=b).sort((x,y)=>y.date.localeCompare(x.date));$('#weekTotal').textContent=fmt(rows.reduce((s,r)=>s+r.input+r.output,0))+' Token';let box=$('#records');box.replaceChildren();if(!rows.length){let empty=document.createElement('div');empty.className='empty';empty.innerHTML='<div>✳</div>这一周还没有记录';box.append(empty);return}rows.forEach(r=>{let item=document.createElement('div');item.className='record';let info=document.createElement('div'),title=document.createElement('strong'),detail=document.createElement('p');title.textContent=r.note||'Token 使用记录';detail.textContent=r.date+' · 输入 '+fmt(r.input)+' · 输出 '+fmt(r.output);info.append(title,detail);let right=document.createElement('div'),sum=document.createElement('strong'),del=document.createElement('button');sum.textContent=fmt(r.input+r.output);del.className='delete';del.textContent='删除';del.setAttribute('aria-label','删除 '+r.date+' 的记录');del.onclick=()=>{if(confirm('确定删除这条记录吗？')){let before=records;records=records.filter(x=>x.id!==r.id);if(!save())records=before;render()}};right.append(sum,del);item.append(info,right);box.append(item)})}
$('#date').value=localDate(new Date());$('#form').onsubmit=e=>{e.preventDefault();if(!storageOK){$('#message').textContent='请先解决本地数据读取问题或导入备份，避免覆盖原有记录。';return}let record={id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),date:$('#date').value,input:Number($('#input').value),output:Number($('#output').value),note:$('#note').value.trim()};if(!valid([...records,record])){$('#message').textContent='请输入有效的非负整数，且累计总量不能超过安全范围。';return}records.push(record);if(!save()){records.pop();return}$('#input').value='';$('#output').value='';$('#note').value='';$('#message').textContent='记录已添加。';render()};$('#prev').onclick=()=>{offset--;render()};$('#next').onclick=()=>{offset++;render()};$('#today').onclick=()=>{offset=0;render()};$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='token-backup-'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importBtn').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error();let data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.records)||!valid(data.records)||new Set(data.records.map(x=>x.id)).size!==data.records.length)throw Error();if(!confirm('导入将替换当前所有记录。建议先导出备份，是否继续？'))return;let old=records;records=data.records;if(!save()){records=old;return}$('#message').textContent='备份导入成功。';render()}catch(err){$('#message').textContent='导入失败：文件格式无效或数据超出支持范围。'}finally{e.target.value=''}};render();
</script></body></html>
